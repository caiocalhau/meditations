[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meditations"
version = "0.1.0.dev0"
description = "Evidence-based engineering reflection from AI-assisted work"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic==2.13.5"]

[project.scripts]
meditations = "meditations.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.setuptools.packages.find]
where = ["src"]
